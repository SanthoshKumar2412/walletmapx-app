<div class="min-h-[100dvh] bg-gray-100 flex items-center justify-center px-4 py-8">

  <div class="w-full max-w-md">

    <!-- Logo / Brand -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-blue-600">
        WalletMapX
      </h1>

      <p class="mt-2 text-gray-500">
        Manage your money. Track your future.
      </p>
    </div>

    <!-- Login Card -->
    <div class="rounded-2xl bg-white p-6 shadow-lg sm:p-8">

      <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-900">
          Welcome back
        </h2>

        <p class="mt-1 text-sm text-gray-500">
          Sign in to your account
        </p>
      </div>

      <!-- Error -->
      @if (errorMessage) {
        <div
          class="mb-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600"
        >
          {{ errorMessage }}
        </div>
      }

      <form
        (ngSubmit)="onLogin()"
        #loginForm="ngForm"
        class="space-y-5"
      >

        <!-- Email -->
        <div>
          <label
            for="email"
            class="mb-2 block text-sm font-medium text-gray-700"
          >
            Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="loginData.email"
            required
            autocomplete="email"
            placeholder="Enter your email"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />
        </div>

        <!-- Password -->
        <div>
          <label
            for="password"
            class="mb-2 block text-sm font-medium text-gray-700"
          >
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="loginData.password"
            required
            autocomplete="current-password"
            placeholder="Enter your password"
            class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
          />
        </div>

        <!-- Login -->
        <button
          type="submit"
          [disabled]="loading || loginForm.invalid"
          class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
        >
          @if (loading) {
            Signing in...
          } @else {
            Sign In
          }
        </button>

      </form>

      <!-- Register -->
      <p class="mt-6 text-center text-sm text-gray-600">
        Don't have an account?

        <a
          routerLink="/register"
          class="font-semibold text-blue-600 hover:text-blue-700"
        >
          Create account
        </a>
      </p>

    </div>

  </div>

</div>
